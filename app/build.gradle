plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.serialization' version "$kotlin_version"
    id 'org.jetbrains.kotlin.android'
    id 'io.kotest' version "$kotest_version"
}

android {
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    def gitDescribe = { ->
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--always', '--dirty', '--match', '"not a tag"'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        // One build identity, for every build type. Upstream had two, chosen by
        // which branch was building; Ding has one branch, so there is nothing
        // left to choose between.
        applicationId "app.ding"

        // The version, as three numbers plus a sub-version for an extra release
        // that does not move the point version.
        def versionCodeMajor = 0
        def versionCodeMinor = 9
        def versionCodePoint = 15
        def versionCodeSub = 0

        // The version code packs those four numbers into one integer, each in a
        // fixed field of decimal digits: sub gets 2 digits, point 2, minor 3,
        // major 2. Upstream reserved one more digit, between sub and point, to
        // mark the release channel so that a dev build and a production build of
        // the same version got different codes. That channel is gone, so the
        // digit is gone too and the fields above it each moved down one decade.
        //     10^9 is the reserve digit, which can only be 0 or 1 with full
        //     range below. Max value allowed by Google Play: 2100000000.
        versionCode = new Integer(
                10**0 * versionCodeSub // 2 digits
              + 10**2 * versionCodePoint // 2 digits
              + 10**4 * versionCodeMinor // 3 digits
              + 10**7 * versionCodeMajor // 2 digits
        )

        def gitDescription = "${gitDescribe()}"

        versionName = versionCodeMajor + "." + versionCodeMinor + "." + versionCodePoint + "-" + gitDescription

        minSdkVersion 31
        targetSdkVersion 34

        archivesBaseName = "Ding_" + versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }
    buildTypes {
        debug {
            // NOTE Currently minifying is necessary also in debug build because otherwise the 64K limit is exceeded (and we don't want to deal with multidex for now).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Needed for Kotest with JUnit
    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
        // The Robolectric tests read the app's own resources and manifest — string
        // keys, the preference screens, the broadcast receiver — so the unit-test
        // stage has to be given them.
        unitTests.includeAndroidResources true

        // The device stage: an emulator Gradle creates, boots, runs the
        // androidTest suite on and tears down by itself, so that
        // scripts/check-device.sh and .github/workflows/device.yml run the same
        // image here and on a runner. It is deliberately not part of the seven
        // stages of scripts/check.sh — an emulator boot on every commit would
        // erode the run-the-gate-always habit.
        //
        // Gradle keeps this AVD under ~/.android/avd/gradle-managed and treats it
        // as a build output, so the run never touches the hand-made
        // bench-pixel6-aosp AVD and never uninstalls anything from an attached
        // device, unlike connectedDebugAndroidTest.
        // `./gradlew :app:cleanManagedDevices` deletes it.
        managedDevices {
            localDevices {
                pixel6aosp {
                    // The display name from `avdmanager list device`, not the
                    // "pixel_6" profile id. Same proxy for the GrapheneOS Pixel 6
                    // that the manual checks use.
                    device = "Pixel 6"
                    apiLevel = 36
                    // "aosp" resolves to system-images;android-36;default;x86_64 —
                    // pure AOSP, no Google APIs. Left unset AGP would default to
                    // "google", i.e. an image carrying the Play Services this app
                    // may never depend on.
                    systemImageSource = "aosp"
                    // Pinned because AGP 9 flips the default to arm64-v8a, which
                    // this host's AOSP image cannot translate. AGP 8.13 prints
                    // "pixel6aosp has an unspecified testedAbi" anyway, whether or
                    // not it is spelled out — its setup task copies every other
                    // device property onto itself but not this one, so its own copy
                    // is always empty. The value is honoured where it matters; the
                    // message is noise. Re-check on the next AGP bump.
                    testedAbi = "x86_64"
                }
            }
        }
    }

    // The lint gate fails on errors, not on warnings. There are pre-existing
    // warnings in this codebase; making them fatal is a cleanup campaign, and
    // holding the gate hostage to it would mean the gate never gets switched on
    // at all. Flip `warningsAsErrors` once that backlog is empty.
    lint {
        abortOnError true
        warningsAsErrors false
    }

    namespace 'app.ding'
}

dependencies {
    implementation "androidx.core:core-ktx:1.17.0"
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'de.cketti.library.changelog:ckchangelog:1.2.2'

    // Have to specify version here to avoid build failure due to duplicate classes (seems to be used by multiple dependencies)
    def lifecycle_version = '2.9.4'
    //noinspection GradleDependency
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"

    // Jupiter and the vintage engine are two halves of one JUnit Platform release
    // and have to move together.
    def junit_platform_version = '6.0.0'
    testImplementation "org.junit.jupiter:junit-jupiter:$junit_platform_version"
    testImplementation "io.kotest:kotest-framework-engine:$kotest_version"
    testImplementation "io.kotest:kotest-assertions-core:$kotest_version"
    testImplementation "io.kotest:kotest-runner-junit5:$kotest_version"

    // Robolectric runs the Android half — alarms, notifications, pending intents,
    // shared preferences — in the JVM unit-test stage, so the glue in
    // ReminderManager.kt is tested on every commit instead of only on a device. Its
    // tests are JUnit 4 classes, which is the only style Robolectric runs, so the
    // vintage engine goes on the JUnit Platform run beside the Kotest specs.
    // org.robolectric is not a Google Play Services group, so the Google guard is
    // untouched; keep it that way.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testRuntimeOnly "org.junit.vintage:junit-vintage-engine:$junit_platform_version"

    // The device stage. androidx.test is the instrumentation runner named by
    // testInstrumentationRunner above, plus the rules the smoke test uses to grant
    // POST_NOTIFICATIONS; androidTest is JUnit 4, which is what the runner runs.
    // None of these is a Play Services group. Note that the guard below would not
    // have caught one that was: it walks the app variants' runtime classpaths, and
    // the androidTest classpath is not one of them. Nothing here ships in the APK,
    // which is what the constraint is about, but the guard is not the reason.
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

// ---------------------------------------------------------------------------
// Google-dependency guard
// ---------------------------------------------------------------------------
// The app must keep working on a de-Googled OS (GrapheneOS with no Play Services,
// sandboxed or otherwise), so nothing on the runtime classpath may pull in Play
// Services or Firebase — including transitively, which is how it would actually
// happen.
//
// Match on group coordinates, never on the string "google":
// `com.google.android.material` is AndroidX Material Components, this app already
// depends on it, and it has nothing to do with Play Services.
def bannedDependencyGroups = ['com.google.android.gms', 'com.google.firebase'] as Set
def bannedDependencyModuleFragment = 'play-services'

// Collected from the variant API rather than hard-coded to debug and release, so
// that a build type or product flavour added later is guarded the day it
// appears. "May never enter the graph" is not a constraint that should depend on
// someone remembering to extend a list.
def guardedConfigurations = []
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    guardedConfigurations.add(variant.runtimeConfiguration.name)
}

tasks.register('checkNoGoogleDependencies') {
    group = 'verification'
    description = 'Fails if the runtime classpath pulls in Play Services or Firebase.'

    // Resolve the whole dependency graph, not just the first level: the point of
    // the guard is to catch what an innocent-looking dependency drags in behind it.
    def dependencyGraphs = guardedConfigurations.collectEntries { name ->
        [(name): configurations.named(name).flatMap { it.incoming.resolutionResult.rootComponent }]
    }

    doLast {
        // A guard that inspects nothing passes everything. If the variant API
        // ever hands back an empty list, that has to be loud rather than green.
        if (dependencyGraphs.isEmpty()) {
            throw new GradleException("checkNoGoogleDependencies found no variant runtime"
                    + " classpath to inspect, so it checked nothing. Fix the guard.")
        }

        def offenders = new TreeSet<String>()

        dependencyGraphs.each { configurationName, rootComponent ->
            def visited = new HashSet<String>()
            def pending = new ArrayDeque<ResolvedComponentResult>()
            pending.add(rootComponent.get())

            while (!pending.isEmpty()) {
                def component = pending.poll()
                if (!visited.add(component.id.displayName)) {
                    continue
                }

                def id = component.id
                if (id instanceof ModuleComponentIdentifier
                        && (bannedDependencyGroups.contains(id.group)
                            || id.module.contains(bannedDependencyModuleFragment))) {
                    offenders.add("  $id.group:$id.module:$id.version  (in $configurationName)".toString())
                }

                component.dependencies.each { dependency ->
                    if (dependency instanceof ResolvedDependencyResult) {
                        pending.add(dependency.selected)
                    }
                }
            }
        }

        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "Google Play Services / Firebase dependencies are not allowed:\n"
                            + offenders.join("\n")
                            + "\n\nThis app has to run on a de-Googled OS. Find a replacement, or"
                            + "\nchange this rule deliberately in app/build.gradle.")
        }
    }
}

// Wire the guard into the standard lifecycle so it is not only enforced by the
// scripts that happen to remember to call it.
tasks.named('check') {
    dependsOn 'checkNoGoogleDependencies'
}
