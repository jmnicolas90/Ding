name: CI

on:
  push:
  pull_request:

# One job, run in the same order as scripts/check.sh. Splitting the stages into
# parallel jobs would make each one re-run Gradle configuration and re-build the
# same inputs, for no gain on a single-module project. Steps stop at the first
# failure, so the fail-fast behaviour matches the local gate too.
jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches the sourceCompatibility/targetCompatibility in
          # app/build.gradle. If those move, move this with them.
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # No Android SDK bootstrap step: the GitHub `ubuntu-latest` image ships
      # one, including the platforms/android-36 that compileSdk 36 needs. That
      # is the only thing in this file that depends on the runner image — if
      # this workflow ever has to move to the self-hosted Forgejo runner, add
      # an SDK install step here and the rest carries over unchanged.

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # The GrapheneOS constraint, enforced rather than documented: nothing on
      # the runtime classpath may pull in Play Services or Firebase.
      - name: No Google dependencies
        run: ./gradlew :app:checkNoGoogleDependencies

      - name: Debug APK
        run: ./gradlew :app:assembleDebug

      # Its own step because the release build runs R8 for real, while the debug
      # build is debuggable and so skips optimization and obfuscation even with
      # minifyEnabled on. A broken ProGuard rule is invisible until here.
      - name: Release APK
        run: ./gradlew :app:assembleRelease

      # Lint's HTML/XML report is the only useful artifact when the gate goes
      # red on a machine nobody can log into.
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
