name: CI

on:
  push:
    # Every branch, because ticket branches have to be green before they merge
    # back to main. Naming branches also excludes tags, which is what we want —
    # a release tag points at a commit the gate has already passed on.
    #
    # It has to be spelled this way round. A bare `tags-ignore: ["**"]` looks
    # equivalent and is not: when only a tag filter is given, GitHub runs the
    # workflow for no branch push at all. That mistake was made here and caught
    # only because the next push produced no CI run whatsoever — a gate that
    # silently stops running is worse than one that fails.
    branches: ["**"]
  pull_request:

# A branch that has a PR open fires both triggers. Rather than drop one and lose
# either ticket-branch coverage or PR coverage, let both fire and cancel runs
# that a newer push has already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One job, run in the same order as scripts/check.sh. Splitting the stages into
# parallel jobs would make each one re-run Gradle configuration and re-build the
# same inputs, for no gain on a single-module project. Steps stop at the first
# failure, so the fail-fast behaviour matches the local gate too.
jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The email guard below checks every commit this fork authored, not
          # just the checked-out tree, so it needs the whole history. The
          # default here is a depth-1 clone, and the guard treats a shallow one
          # as a failure rather than passing on what it cannot see.
          fetch-depth: 0

      # First, because it needs nothing but the checkout and takes under a
      # second. Same script scripts/check.sh runs as its G1, so the pattern,
      # the allowlist and the commit range cannot drift between the two gates.
      - name: No personal email addresses
        run: scripts/check-no-personal-email.sh

      # The ticket specified @v4; this workflow's own first CI run annotated it
      # as deprecated, along with the Node 20 runtime it and the two actions
      # around it target. Bumped to the current majors on that evidence.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Matches the sourceCompatibility/targetCompatibility in
          # app/build.gradle. If those move, move this with them.
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # No Android SDK bootstrap step: the GitHub `ubuntu-latest` image ships
      # one, including the platforms/android-36 that compileSdk 36 needs. That
      # is the only thing in this file that depends on the runner image — if
      # this workflow ever has to move to the self-hosted Forgejo runner, add
      # an SDK install step here and the rest carries over unchanged.

      # Both variants: the ticket's own argument for a separate release APK step —
      # that release-only breakage is invisible to a debug gate — applies to lint.
      - name: Lint
        run: ./gradlew :app:lintDebug :app:lintRelease

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # The GrapheneOS constraint, enforced rather than documented: nothing on
      # the runtime classpath may pull in Play Services or Firebase.
      - name: No Google dependencies
        run: ./gradlew :app:checkNoGoogleDependencies

      - name: Debug APK
        run: ./gradlew :app:assembleDebug

      # Its own step, though not for the reason the ticket gave: both build types
      # set minifyEnabled with the same proguardFiles, so the debug step already
      # exercises the keep rules. What the debug build skips, being debuggable,
      # is R8's optimization and obfuscation passes — and only breakage from
      # those is invisible until here.
      - name: Release APK
        run: ./gradlew :app:assembleRelease
