name: Device

on:
  # Not every branch: ticket branches run ci.yml, and this pair runs where merges
  # land. That mirrors scripts/check-device.sh, which runs before every `--no-ff`
  # merge to `main` — same task, same moment, one locally and one on a runner.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    name: Device
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Matches ci.yml and the sourceCompatibility/targetCompatibility in
          # app/build.gradle. If those move, move this with them.
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # Without hardware virtualisation the emulator either refuses to boot or
      # crawls. GitHub's Linux runners have KVM but do not hand it to the job by
      # default; this is the udev rule GitHub documents for opening it up.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The same Gradle task scripts/check-device.sh runs. What it does NOT carry
      # is that script's `-Pandroid.testoptions.manageddevices.emulator.gpu=host`:
      # the dev desktop segfaults under the SwiftShader renderer AGP defaults to,
      # and this runner has no host GPU to hand out, so the renderer is the one
      # thing chosen per host. The task, the device and the image are the same.
      #
      # AGP downloads the system image itself; the runner image ships the SDK and
      # its licence files, which is what that download is gated on.
      - name: Device test
        run: ./gradlew :app:pixel6aospDebugAndroidTest
